*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--app-bg);color:var(--ui-text);font-family:var(--font-ui);font-size:14px;line-height:1.35;display:flex;flex-direction:column;overflow:hidden;}
[hidden]{display:none !important;}
button,select,input{font:inherit;font-size:0.84rem;color:var(--ui-text);}
button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.2rem 0.6rem;cursor:pointer;min-height:28px;}
button:hover{background:var(--surface-2);border-color:var(--border-strong);}
button:active{background:var(--surface-3);}
button:disabled{opacity:0.5;cursor:default;}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
button.link{background:none;border:none;padding:0;min-height:0;color:var(--insight);text-decoration:underline;}
select,input[type="text"],input[type="search"]{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.15rem 0.4rem;min-height:28px;}
select:hover,input[type="text"]:hover,input[type="search"]:hover{border-color:var(--border-strong);}
input[type="checkbox"]{accent-color:var(--primary);}
.mono,pre,textarea,code{font-family:var(--font-code);font-size:0.8rem;}
.note{color:var(--ui-text-2);font-size:0.78rem;margin:0.25rem 0;}
.icon{flex:none;display:block;}
.icon-line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.icon-fill{fill:currentColor;}
.app-header{flex:none;position:relative;z-index:30;display:flex;flex-wrap:nowrap;align-items:center;gap:0.9rem;padding:0.3rem 0.9rem;min-height:50px;background:var(--surface);border-bottom:1px solid var(--border);}
.app-header>*{flex-shrink:0;}
.app-header.hb-tight{gap:0.6rem;}
.brand{display:flex;align-items:center;gap:0.6rem;min-width:0;}
.app-logo:empty{display:none;}
.app-logo{display:flex;align-items:center;}
.app-header{--brand-h:22px;}
.app-header.hb-tight{--brand-h:18px;}
.app-header.hb-mini{--brand-h:14px;}
.brand-logo{height:var(--brand-h);width:auto;display:block;}
.brand-icon{display:none;}
.has-logo .app-title,.has-logo .app-subtitle{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
.arch-ctx{display:flex;align-items:center;gap:0.4rem;margin-left:0.4rem;}
.arch-ctx .tool-field select{max-width:13rem;}
.about{max-width:min(34rem,calc(100vw - 2rem));padding:1.2rem 1.4rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ui-text);box-shadow:var(--shadow-pop);}
.about::backdrop,.mem-dialog::backdrop{background:rgba(10,20,24,0.45);}
.mem-dialog{width:min(46rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem);overflow:auto;padding:1rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ui-text);box-shadow:var(--shadow-pop);}
.mem-dialog h2{margin:0 0 0.3rem;font-size:1.05rem;}
.mem-dialog fieldset{margin:0.6rem 0;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem 0.7rem 0.6rem;}
.mem-dialog legend{font-weight:650;font-size:0.85rem;padding:0 0.3rem;}
.mem-radio{display:block;margin:0.25rem 0;font-size:0.86rem;}
.mem-field{display:flex;flex-direction:column;gap:0.15rem;font-size:0.8rem;color:var(--ui-text-2);margin:0.3rem 0;}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:0.2rem 0.8rem;}
.mem-num{width:100%;}
.mem-problems{margin:0.5rem 0;color:var(--ui-error);font-size:0.84rem;}
.mem-problems p{margin:0 0 0.2rem;font-weight:650;}
.mem-dialog .dialog-actions{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:flex-end;margin-top:0.6rem;}
.tool.tool-active{border-color:var(--primary);color:var(--primary);}
.addr-split{display:flex;gap:2px;margin:0.4rem 0;font-size:0.72rem;}
.addr-part{display:flex;flex-direction:column;align-items:center;min-width:3.4rem;padding:0.15rem 0.3rem;border-radius:3px;border:1px solid var(--border-strong);}
.addr-tag{background:var(--primary-soft);}
.addr-index{background:var(--changed-bg);}
.addr-offset{background:var(--surface-3);}
.addr-name{white-space:nowrap;}
.mem-diagram{display:flex;align-items:center;gap:0.5rem;margin:0.2rem 0 0.6rem;flex-wrap:wrap;font-size:0.8rem;}
.mem-paths{display:flex;flex-direction:column;gap:0.25rem;}
.mem-path{display:inline-flex;align-items:center;gap:0.3rem;}
.mem-box{padding:0.2rem 0.6rem;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);}
.mem-box.mem-on{border-color:var(--primary);background:var(--primary-soft);}
.mem-tag{font-weight:650;color:var(--ui-text-2);width:1rem;}
.mem-arrow{color:var(--ui-text-2);}
.mem-stats{border-collapse:collapse;margin:0.4rem 1rem 0.4rem 0;font-size:0.8rem;display:inline-table;vertical-align:top;}
.mem-stats caption{text-align:left;font-weight:650;padding-bottom:0.15rem;}
.mem-stats th{text-align:left;font-weight:400;color:var(--ui-text-2);padding:0.05rem 0.8rem 0.05rem 0;}
.cache-sec h3{font-size:0.86rem;margin:0.6rem 0 0.1rem;}
.mem-lines{max-height:16rem;}
.mem-table tr.mem-hit td{background:var(--changed-bg);}
.mem-table tr.mem-empty td{color:var(--ui-text-2);}
.pane-max{margin-left:auto;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:0.25rem;min-width:26px;height:26px;min-height:0;padding:0 0.4rem;font-size:0.76rem;padding:0;border:1px solid transparent;background:transparent;color:var(--ui-text-2);}
.pane-max + .pane-toggle{margin-left:0.15rem;}
.pane-max .icon{width:16px;height:16px;}
.workspace.dock-max [data-split="root"]>[data-pane="work"],.workspace.dock-max [data-split="root"]>.split-divider,.workspace.dock-max [data-split="root"]>.divider-fold-box{display:none !important;}
.workspace.dock-max [data-split="root"]>[data-pane="dock"]{flex:1 1 0 !important;}
.cache-view{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
.cv-subtabs{display:flex;flex-wrap:wrap;gap:0.25rem;margin:0 0 0.25rem;flex:none;}
.cv-subtabs button{border-radius:999px;padding:0.05rem 0.8rem;min-height:26px;font-size:0.8rem;background:var(--surface-2);border:1px solid var(--border);color:var(--ui-text-2);}
.cv-subtabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-on);font-weight:650;}
.cv-status{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:0.2rem 0.6rem;}
.cv-status .note{margin:0.1rem 0;}
.cache-out{flex:1 1 auto;min-height:0;}
.cv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:0.3rem 0.8rem;margin:0.1rem 0 0.3rem;}
.cv-lastcard{padding:0.2rem 0.7rem;flex:1 1 18rem;}
.cv-lastcard .cv-last{display:inline;}
.cv-card-k{font-size:0.72rem;color:var(--ui-text-2);margin-right:0.5rem;text-transform:uppercase;letter-spacing:0.03em;}
.cv-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:0.8rem;align-items:start;}
.cv-stats{display:flex;flex-direction:column;gap:0.3rem;}
.cv-stats h3{margin:0 0 0.2rem;}
.cv-stats .mem-stats{display:table;margin:0.2rem 0;}
.cv-stack{display:flex;gap:2px;margin:0.4rem 0;font-size:0.72rem;}
.cv-seg{padding:0.1rem 0.4rem;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ui-text);}
.cv-seg-compulsory{background:var(--primary-soft);border:1px solid var(--primary);}
.cv-seg-capacity{background:var(--changed-bg);border:1px solid var(--ui-warning);}
.cv-seg-conflict{background:var(--surface-3);border:1px solid var(--border-strong);}
.cv-help{margin-top:0.8rem;max-width:52rem;}
.cv-help h4{margin:0 0 0.3rem;}
.cv-help p{margin:0.3rem 0;font-size:0.84rem;line-height:1.45;}
.cache-sec{margin:0.8rem 0 1.2rem;padding-top:0.4rem;border-top:1px solid var(--border);}
.cache-sec h3{display:flex;flex-wrap:wrap;gap:0.2rem 0.6rem;align-items:baseline;margin:0 0 0.4rem;}
.cv-name{font-size:1rem;font-weight:700;color:var(--primary);}
.cv-geom{font-size:0.78rem;font-weight:400;color:var(--ui-text-2);}
.cv-summary{display:flex;flex-wrap:wrap;gap:0.5rem 1.2rem;align-items:center;margin:0.3rem 0 0.5rem;}
.cv-rate{display:inline-flex;align-items:center;gap:0.5rem;}
.cv-rate-k{font-size:0.78rem;color:var(--ui-text-2);}
.cv-rate-v{font-size:1.15rem;font-weight:700;min-width:4.2rem;}
.cv-meter{width:9rem;height:0.8rem;accent-color:var(--primary);}
.cv-chips{display:flex;flex-wrap:wrap;gap:0.25rem;}
.cv-chip{display:inline-flex;gap:0.35rem;padding:0.05rem 0.5rem;border:1px solid var(--border);border-radius:999px;font-size:0.74rem;background:var(--surface-2);}
.cv-chip-k{color:var(--ui-text-2);}
.cv-ledger{display:flex;flex-wrap:wrap;gap:0.3rem 0.5rem;align-items:center;margin:0.4rem 0;font-size:0.8rem;}
.cv-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:0.6rem;margin:0.4rem 0;}
.cv-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem 0.7rem;background:var(--surface-2);font-size:0.82rem;}
.cv-card h4{margin:0 0 0.25rem;font-size:0.8rem;color:var(--ui-text-2);text-transform:none;}
.cv-last{margin:0;line-height:1.45;}
.ca-card{margin:0.3rem 0 0.5rem;}
.ca-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.3rem 0.8rem;}
.ca-head h4{margin:0;}
.ca-controls{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0.3rem;}
.ca-progress{margin:0 0 0 0.3rem;}
.ca-diagram{display:flex;flex-wrap:wrap;align-items:center;gap:0.3rem 0.5rem;margin:0.4rem 0;}
.ca-box{padding:0.25rem 0.7rem;border:2px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);font-size:0.8rem;transition:background 0.3s,border-color 0.3s;}
.ca-box.ca-lit{border-color:var(--primary);background:var(--primary-soft);font-weight:700;}
.ca-link,.ca-flow{font-size:0.78rem;color:var(--ui-text-2);}
.ca-flow.ca-lit{color:var(--ui-text);font-weight:700;text-decoration:underline;}
.ca-steps{margin:0.3rem 0 0;padding-left:1.4rem;line-height:1.45;}
.ca-step{display:none;margin:0.2rem 0;padding-left:0.4rem;border-left:4px solid var(--border-strong);}
.ca-step.ca-on{display:list-item;animation:ca-in 0.35s ease-out;}
.ca-step.ca-now{background:var(--primary-soft);}
.ca-step.ca-hit{border-left-color:var(--ui-success);}
.ca-step.ca-miss,.ca-step.ca-eviction{border-left-color:var(--ui-warning);}
.ca-step.ca-fill,.ca-step.ca-memory{border-left-color:var(--primary);}
@keyframes ca-in{from{opacity:0;transform:translateX(-0.5rem);}
to{opacity:1;transform:none;}
}
.cv-hit strong,li.cv-hit{color:var(--ui-text);}
.cv-miss strong,li.cv-miss{color:var(--ui-text);}
.cv-last.cv-hit,li.cv-hit{border-left:4px solid var(--ui-success);padding-left:0.4rem;}
.cv-last.cv-miss,li.cv-miss{border-left:4px solid var(--ui-warning);padding-left:0.4rem;}
.cv-steps{margin:0;padding-left:1.2rem;line-height:1.45;}
.cv-steps li{margin:0.15rem 0;}
.cv-way{list-style:none;margin-left:-0.2rem;padding-left:0.5rem;border-left:3px solid var(--border);}
.cv-way-hit{border-left-color:var(--ui-success);font-weight:600;}
.cv-result{font-weight:600;}
.cv-address{display:flex;gap:2px;margin:0.25rem 0;flex-wrap:wrap;}
.cv-bits{display:flex;flex-direction:column;align-items:center;padding:0.1rem 0.4rem;border-radius:3px;border:1px solid var(--border-strong);}
.cv-binary{letter-spacing:0.03em;font-size:0.8rem;white-space:nowrap;}
.cv-bitsname{font-size:0.68rem;color:var(--ui-text);}

.gm-cell.gm-hot{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700;}
.gm-scroll{max-width:100%;overflow-x:auto;}
.gm-timeline{border-collapse:collapse;font-size:0.72rem;}
.gm-timeline caption{text-align:left;font-size:0.8rem;color:var(--ui-text-2);padding:0.2rem 0;}
.gm-timeline th{font-weight:500;padding:0 0.3rem;white-space:nowrap;}
.gm-timeline thead th{min-width:1.2rem;text-align:center;color:var(--ui-text-2);}
.gm-timeline td.gm-t{text-align:center;min-width:1.2rem;border:1px solid var(--border);font-family:var(--font-code);}
.gm-timeline td.gm-iss{background:var(--fig-fill-alt);border-color:var(--text);}
.gm-timeline td.gm-ld{background:var(--accent-tint);border-color:var(--text);font-weight:700;}
.gm-timeline td.gm-gap{color:var(--ui-error);font-weight:700;}
.gm-timeline tr.gm-issue th,.gm-timeline tr.gm-issue td{border-top:2px solid var(--text);}
@media (forced-colors:active){.gm-cell.gm-idle{background:Canvas;color:GrayText;}
.gm-frame{border-color:CanvasText;}
}
@media (max-width:40rem){.gm-rowlabel{width:5.5rem;}
}

":\"asm\"},{\"id\":\"negate\",\"file\":\"negate.json\",\"group\":\"arith\",\"title\":\"The negative of a number\",\"lang\":\"asm\"},{\"id\":\"running-total\",\"file\":\"running-total.json\",\"group\":\"output\",\"title\":\"A running total\",\"lang\":\"asm\"},{\"id\":\"both-differences\",\"file\":\"both-differences.json\",\"group\":\"output\",\"title\":\"Both differences\",\"lang\":\"asm\"},{\"id\":\"times-ten\",\"file\":\"times-ten.json\",\"group\":\"arith\",\"title\":\"Ten times a number\",\"lang\":\"asm\"}]}\n","content/sap-1/exercises/negate.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). A practice exercise written for MAVILERA (spec WS-F-148), not taken from a textbook; produced by tools/make-sap1-exercises.mjs.\",\"format\":\"risc-vista-exercise\",\"version\":1,\"arch\":\"sap-1\",\"title\":\"The negative of a number\",\"task\":\"Show on OUT the two's-complement negative of the byte at x: the byte that gives 0 when added to x. SAP-1 has no negate instruction; the byte at zero holds 0. Keep the labels and their DB lines.\",\"lang\":\"asm\",\"starter\":\"; negate -- practice exercise (MAVILERA, SAP-1)\\n; Show on OUT the byte that gives 0 when added to x.\\n; Hint: 0 - x. The byte at zero is 0.\\n        HLT           ; replace with your code\\n\\n        ORG 0EH       ; the data at the end of the memory\\nzero:   DB 0\\nx:      DB 0\\n\",\"tests\":[{\"name\":\"-1\",\"memory\":[{\"at\":\"x\",\"bytes\":[1]}],\"expect\":{\"outputs\":[255],\"registers\":{\"OUT\":255}}},{\"name\":\"-0\",\"memory\":[{\"at\":\"x\",\"bytes\":[0]}],\"expect\":{\"outputs\":[0],\"registers\":{\"OUT\":0}}},{\"name\":\"-100\",\"memory\":[{\"at\":\"x\",\"bytes\":[100]}],\"expect\":{\"outputs\":[156],\"registers\":{\"OUT\":156}}},{\"name\":\"-128\",\"memory\":[{\"at\":\"x\",\"bytes\":[128]}],\"expect\":{\"outputs\":[128],\"registers\":{\"OUT\":128}}},{\"name\":\"-255\",\"memory\":[{\"at\":\"x\",\"bytes\":[255]}],\"expect\":{\"outputs\":[1],\"registers\":{\"OUT\":1}}}]}\n","content/sap-1/exercises/running-total.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). A practice exercise written for MAVILERA (spec WS-F-148), not taken from a textbook; produced by tools/make-sap1-exercises.mjs.\",\"format\":\"risc-vista-exercise\",\"version\":1,\"arch\":\"sap-1\",\"title\":\"A running total\",\"task\":\"Show on OUT, one after another, the byte at a, then the sum of a and b, then the sum of a, b and c (each modulo 256), then stop. Keep the labels and their DB lines.\",\"lang\":\"asm\",\"starter\":\"; running-total -- practice exercise (MAVILERA, SAP-1)\\n; Show a, then a + b, then a + b + c on OUT.\\n; Hint: OUT copies A and leaves it as it is.\\n        HLT           ; replace with your code\\n\\n        ORG 0DH       ; the data at the end of the memory\\na:      DB 0\\nb:      DB 0\\nc:      DB 0\\n\",\"tests\":[{\"name\":\"5, 6, 7\",\"memory\":[{\"at\":\"a\",\"bytes\":[5]},{\"at\":\"b\",\"bytes\":[6]},{\"at\":\"c\",\"bytes\":[7]}],\"expect\":{\"outputs\":[5,11,18],\"registers\":{\"OUT\":18}}},{\"name\":\"200, 50, 10\",\"memory\":[{\"at\":\"a\",\"bytes\":[200]},{\"at\":\"b\",\"bytes\":[50]},{\"at\":\"c\",\"bytes\":[10]}],\"expect\":{\"outputs\":[200,250,4],\"registers\":{\"OUT\":4}}},{\"name\":\"0, 0, 1\",\"memory\":[{\"at\":\"a\",\"bytes\":[0]},{\"at\":\"b\",\"bytes\":[0]},{\"at\":\"c\",\"bytes\":[1]}],\"expect\":{\"outputs\":[0,0,1],\"registers\":{\"OUT\":1}}},{\"name\":\"128, 128, 128\",\"memory\":[{\"at\":\"a\",\"bytes\":[128]},{\"at\":\"b\",\"bytes\":[128]},{\"at\":\"c\",\"bytes\":[128]}],\"expect\":{\"outputs\":[128,0,128],\"registers\":{\"OUT\":128}}}]}\n","content/sap-1/exercises/sum-four.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). A practice exercise written for MAVILERA (spec WS-F-148), not taken from a textbook; produced by tools/make-sap1-exercises.mjs.\",\"format\":\"risc-vista-exercise\",\"version\":1,\"arch\":\"sap-1\",\"title\":\"Add four numbers\",\"task\":\"Show on OUT the sum of the four bytes at a, b, c and d, then stop. The sum is taken modulo 256, as the adder-subtracter does. Keep the four labels and their DB lines: the tests write the numbers there.\",\"lang\":\"asm\",\"starter\":\"; sum-four -- practice exercise (MAVILERA, SAP-1)\\n; Show on OUT the sum of the bytes at a, b, c and d.\\n; Hint: load one, add the others, then OUT and HLT.\\n        HLT           ; replace with your code\\n\\n        ORG 0CH       ; the data at the end of the memory\\na:      DB 0\\nb:      DB 0\\nc:      DB 0\\nd:      DB 0\\n\",\"tests\":[{\"name\":\"1 + 2 + 3 + 4\",\"memory\":[{\"at\":\"a\",\"bytes\":[1]},{\"at\":\"b\",\"bytes\":[2]},{\"at\":\"c\",\"bytes\":[3]},{\"at\":\"d\",\"bytes\":[4]}],\"expect\":{\"outputs\":[10],\"registers\":{\"OUT\":10}}},{\"name\":\"100 + 100 + 50 + 10\",\"memory\":[{\"at\":\"a\",\"bytes\":[100]},{\"at\":\"b\",\"bytes\":[100]},{\"at\":\"c\",\"bytes\":[50]},{\"at\":\"d\",\"bytes\":[10]}],\"expect\":{\"outputs\":[4],\"registers\":{\"OUT\":4}}},{\"name\":\"255 + 1 + 0 + 0\",\"memory\":[{\"at\":\"a\",\"bytes\":[255]},{\"at\":\"b\",\"bytes\":[1]},{\"at\":\"c\",\"bytes\":[0]},{\"at\":\"d\",\"bytes\":[0]}],\"expect\":{\"outputs\":[0],\"registers\":{\"OUT\":0}}},{\"name\":\"17 + 0 + 0 + 0\",\"memory\":[{\"at\":\"a\",\"bytes\":[17]},{\"at\":\"b\",\"bytes\":[0]},{\"at\":\"c\",\"bytes\":[0]},{\"at\":\"d\",\"bytes\":[0]}],\"expect\":{\"outputs\":[17],\"registers\":{\"OUT\":17}}}]}\n","content/sap-1/exercises/times-ten.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). A practice exercise written for MAVILERA (spec WS-F-148), not taken from a textbook; produced by tools/make-sap1-exercises.mjs.\",\"format\":\"risc-vista-exercise\",\"version\":1,\"arch\":\"sap-1\",\"title\":\"Ten times a number\",\"task\":\"Show on OUT ten times the byte at x (modulo 256), then stop. SAP-1 cannot multiply or shift, and an instruction can only add a byte of the memory: count the bytes your program needs, since the memory has sixteen. Keep the label x and its DB line.\",\"lang\":\"asm\",\"starter\":\"; times-ten -- practice exercise (MAVILERA, SAP-1)\\n; Show 10 times x on OUT.\\n; Hint: only additions; the program and x must fit the sixteen bytes.\\n        HLT           ; replace with your code\\n\\n        ORG 0FH       ; the data at the end of the memory\\nx:      DB 0\\n\",\"tests\":[{\"name\":\"10 × 0\",\"memory\":[{\"at\":\"x\",\"bytes\":[0]}],\"expect\":{\"outputs\":[0],\"registers\":{\"OUT\":0}}},{\"name\":\"10 × 3\",\"memory\":[{\"at\":\"x\",\"bytes\":[3]}],\"expect\":{\"outputs\":[30],\"registers\":{\"OUT\":30}}},{\"name\":\"10 × 25\",\"memory\":[{\"at\":\"x\",\"bytes\":[25]}],\"expect\":{\"outputs\":[250],\"registers\":{\"OUT\":250}}},{\"name\":\"10 × 26\",\"memory\":[{\"at\":\"x\",\"bytes\":[26]}],\"expect\":{\"outputs\":[4],\"registers\":{\"OUT\":4}}},{\"name\":\"10 × 255\",\"memory\":[{\"at\":\"x\",\"bytes\":[255]}],\"expect\":{\"outputs\":[246],\"registers\":{\"OUT\":246}}}]}\n","content/sap-1/help/help.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). In-app help of the MAVILERA SAP-1 Laboratory, written for the application (spec W-D20); shown by the Help dialog (src/ui/help-dialog.js). The detailed documentation is content/sap-1/help/docs/.\",\"sections\":[{\"id\":\"about\",\"title\":\"About SAP-1\",\"blocks\":[{\"brand\":true},{\"p\":\"SAP-1 is the first of the simple-as-possible (SAP) computers, teaching designs by Albert Paul Malvino in his textbook Digital Computer Electronics (McGraw-Hill, first edition 1977; third edition with Jerald A. Brown, Glencoe/McGraw-Hill, 1993). The book presents SAP-1, SAP-2 and SAP-3 in turn as computers a student can build from digital components; its preface describes their instruction set as a subset of the Intel 8085's. SAP-1 is a textbook design, not a commercial product.\"},{\"p\":\"SAP-1 has five instructions (LDA, ADD, SUB, OUT and HLT), sixteen bytes of memory, an accumulator, a B register, an adder-subtracter and an output register on one 8-bit bus, the W bus. A controller-sequencer steps every instruction through six timing states.\"},{\"p\":\"Why it matters: SAP-1 shows the whole of a stored-program computer, fetch and execute, bus transfers and the control word, in parts few enough to follow one clock at a time. It prepares for the larger SAP-2 and for real 8-bit microprocessors.\"},{\"p\":\"Where it is seen today: Ben Eater has said that the programmable 8-bit computer he built on breadboards follows, roughly, the SAP-1 architecture of this book.\"},{\"p\":\"The detailed description of SAP-1 is chapter 10 of the book. The book has no DOI.\"},{\"refs\":[[\"Digital Computer Electronics, third edition\",null,\"A. P. Malvino, J. A. Brown. Glencoe/McGraw-Hill, 1993. ISBN 0-02-800594-5. Chapter 10: SAP-1.\"],[\"The Amp Hour #444: An Interview with Ben Eater\",\"https://theamphour.com/444-an-interview-with-ben-eater/\",\"27 May 2019.\"],[\"Ben Eater: 8-bit computer\",\"https://eater.net/8bit/\",null]]},{\"notice\":\"SAP-1 is described in Digital Computer Electronics by Albert Paul Malvino and Jerald A. Brown, © 1977, 1983 McGraw-Hill, Inc. and © 1983, 1993 Glencoe/McGraw-Hill. MAVILERA reproduces no text or figure of the book; its simulator, drawings, help and programs are its own. It is not affiliated with or endorsed by the authors, the publisher or Ben Eater. Intel is a trademark of Intel Corporation or its subsidiaries.\"}]},{\"id\":\"start\",\"title\":\"Getting started\",\"blocks\":[{\"p\":\"The MAVILERA SAP-1 Laboratory runs SAP-1 programs in your browser and shows how the computer executes them on its bus. Nothing is installed and nothing is uploaded.\"},{\"ol\":[\"Type a program in the editor, or open one from Templates in the toolbar: short programs that each show one idea, with a note at the top on what to try.\",\"Press Assemble (Ctrl+Enter). Errors are marked in the editor and explained in the console.\",\"Step through the program with Step (F10) and Step back (Shift+F10), or run it with Run (F5).\",\"Watch the registers A, B, OUT and PC, the sixteen bytes of memory and the console, where each OUT writes a line.\",\"Switch to the Bus view to see the same program on the drawing of the computer, one timing state at a time.\"]},{\"p\":\"A program ends with HLT. Without it the computer goes on into the bytes after the program and runs its data as instructions.\"}]},{\"id\":\"views\",\"title\":\"The views\",\"blocks\":[{\"dl\":[[\"Instructions\",\"One instruction per step: the editor, the listing with each byte in hexadecimal and binary, the instruction inspector, the registers, the counters, the memory and the console.\"],[\"Bus\",\"The drawing of the W bus and the units on it. Each step is one clock, one timing state: the unit that drives the bus, the registers that load from it and the control lines that are asserted are highlighted. Step instruction and Back instruction go to the first timing state of the next or of this instruction.\"],[\"Control word\",\"A tab of the Bus view: the twelve lines of the control word CON in the present timing state, with their levels and what each does.\"],[\"Sequence\",\"A tab of the Bus view: the timing states of the present instruction and the transfer each one makes.\"],[\"Waveforms\",\"A tab of the Bus view: chosen signals over the clocks run so far, as a timing diagram; select a clock to go to it.\"]]},{\"p\":\"Select a control signal, in the controller or on its wire, to trace it on the drawing and read what it does in the present state.\"}]},{\"id\":\"programs\",\"title\":\"Writing programs\",\"blocks\":[{\"ul\":[\"Instructions: LDA, ADD, SUB, OUT and HLT. LDA, ADD and SUB take a memory address, 0 to 15, or a label.\",\"Data: DB places bytes; ORG sets the address of what follows. A label ends with a colon; a comment starts with a semicolon.\",\"Numbers: decimal (28), hexadecimal (1CH or 0x1C) or binary (0b00011100).\",\"Point at an instruction in the editor for what it does; completion suggests the mnemonics.\",\"The scratch line above the instruction fields turns one instruction into its byte, or a byte into its instruction, without changing the program.\"]}]},{\"id\":\"debug\",\"title\":\"Running and debugging\",\"blocks\":[{\"ul\":[\"Breakpoints: click a line number in the editor or an address in the listing (B on a row).\",\"Watchpoints: tick a register's eye to stop when it is written; double-click a memory byte, or use Watch, to stop when that byte is written.\",\"Step back undoes one step at a time, back to the start of the run.\",\"Run to cursor stops at the editor's line.\",\"Step over, Step out and the call stack are not available: SAP-1 has no jumps or calls.\",\"A run that does not halt stops after a large number of instructions and says so in the console.\"]}]},{\"id\":\"keys\",\"title\":\"Keyboard\",\"blocks\":[{\"dl\":[[\"Ctrl+Enter\",\"Assemble\"],[\"F5\",\"Run or pause\"],[\"F10 / Shift+F10\",\"Step / step back (in the Bus view, one timing state)\"],[\"Ctrl+F10\",\"Run to the editor's line\"],[\"Ctrl+F\",\"Find in the editor\"],[\"Esc, then Tab\",\"Leave the editor (Tab inside it indents)\"],[\"↑ ↓, Enter, B\",\"In the listing: move, show the fields, set a breakpoint\"],[\"↑ ↓, W\",\"In the registers: move, watch\"],[\"Arrow keys on a divider\",\"Resize panes (Shift for larger steps; Enter restores)\"],[\"Enter on a drawn element\",\"Open its details in the Bus view\"]]}]},{\"id\":\"files\",\"title\":\"Files, sharing and exports\",\"blocks\":[{\"ul\":[\"Your work is kept in this browser: after a refresh or a closed tab, the program, its file name, the cursor, breakpoints, watchpoints and the step you had reached come back.\",\"File ▸ Copy share link puts the program, the view and its settings into a link. They travel in the part after #, which the browser never sends to a server.\",\"File ▸ Save program and settings… writes a .json file; File ▸ Open reads it back, and also .asm files.\",\"Exports: the memory image (.hex for $readmemh, and .bin), the listing and traces (JSON lines, CSV); in the Bus view also a golden dump of the values loaded into OUT and a VCD waveform. File ▸ Import .hex/.bin… loads an image.\",\"Exercises: File ▸ Exercise… lists practice exercises written for MAVILERA, each with a starter program; Run the tests checks your program and shows expected against actual. No solutions are included.\",\"File ▸ Data in and out… loads bytes into memory before a run, and saves a memory range.\"]}]},{\"id\":\"privacy\",\"title\":\"Offline use and privacy\",\"blocks\":[{\"p\":\"Every computation runs in your browser. MAVILERA has no account, sends no telemetry and uploads nothing. After a first visit the hosted version also opens without a network connection, and a single-file version can be downloaded for computers that have none.\"}]}]}\n","content/sap-1/templates/index.json":"{\"_copyright\":\"Copyright (c) 2026 Sajid Muhaimin Choudhury. Licensed under the Apache License, Version 2.0. Rights class: content (Apache-2.0). SAP-1 teaching templates written for the application (phase 5 of the architecture contract, W-D29); what each one shows is checked by test/sap1-templates.test.mjs.\",\"groups\":{\"isa\":\"Instructions\",\"bus\":\"Bus and timing states\"},\"templates\":[{\"id\":\"sum-three\",\"file\":\"sum-three.asm\",\"group\":\"isa\",\"view\":\"isa\",\"lang\":\"asm\",\"title\":\"Add three numbers and show the sum\"},{\"id\":\"wrap-around\",\"file\":\"wrap-around.asm\",\"group\":\"isa\",\"view\":\"isa\",\"lang\":\"asm\",\"title\":\"Subtract past zero: eight-bit numbers wrap around\"},{\"id\":\"multiply\",\"file\":\"multiply.asm\",\"group\":\"isa\",\"view\":\"isa\",\"lang\":\"asm\",\"title\":\"Multiply by repeated addition, without a loop\"},{\"id\":\"missing-hlt\",\"file\":\"missing-hlt.asm\",\"group\":\"isa\",\"view\":\"isa\",\"lang\":\"asm\",\"title\":\"A program without HLT runs into its data\"},{\"id\":\"timing-states\",\"file\":\"timing-states.asm\",\"group\":\"bus\",\"view\":\"bus\",\"lang\":\"asm\",\"title\":\"Fetch and execute, one timing state at a time\"},{\"id\":\"code-is-data\",\"file\":\"code-is-data.asm\",\"group\":\"bus\",\"view\":\"bus\",\"lang\":\"asm\",\"title\":\"Code and data share one memory\"}]}\n"}</script>
